name: Build and test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Source and history secret checks
        run: python3 scripts/check-secrets.py --history
      - name: Core tests (no live credentials)
        run: swift test --parallel --jobs 2
      - name: Build and analyze
        run: >-
          xcodebuild -project SnapLater.xcodeproj -scheme SnapLater
          -configuration Release -destination 'platform=macOS,arch=arm64'
          -derivedDataPath build -jobs 2 CODE_SIGNING_ALLOWED=NO build analyze
      - name: Inspect built app
        run: python3 scripts/check-secrets.py --artifact build/Build/Products/Release/Snipstep.app
      # Native UI tests require a logged-in desktop and automation permissions.
      # Run them locally; never add live Gemini credentials to public CI.
